name: Deploy staging site

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: milesweb-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: staging
      url: https://fkfurniture-preview.herositepro.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Build and zip static files
        run: bash scripts/deploy-milesweb.sh package

      - name: Publish staging to MilesWeb over SSH
        run: bash scripts/deploy-milesweb.sh deploy
        env:
          DEPLOY_HOST: ${{ vars.STAGING_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.STAGING_DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.STAGING_DEPLOY_PORT }}
          DEPLOY_PATH: ${{ vars.STAGING_DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.STAGING_DEPLOY_KNOWN_HOSTS }}
