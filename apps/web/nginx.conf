server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
    }

    location = /.htaccess {
        return 404;
    }

    # Keep directory redirects on the external port when Docker remaps it.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml application/xml text/xml text/plain;

    # Content-hashed bundle files can be cached for a year.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Direct .html files and directory index routes must revalidate.
    location ~ \.html?$ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    # Public images and fonts are replaceable without a new URL.
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot)$ {
        add_header Cache-Control "public, max-age=604800, must-revalidate";
        try_files $uri =404;
    }

    # Serves directory indexes (/about/) and the root; no SPA fallback.
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/ =404;
    }
}
